version: '3.8'

services:
  cassandra:
    image: cassandra:4.1
    container_name: vaneloop-cassandra
    ports:
      - "9042:9042"
    volumes:
      - cassandra_data:/var/lib/cassandra
      - ./cassandra:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces'"]
      interval: 15s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: vaneloop-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build: 
      context: ..
      dockerfile: api/Dockerfile
    container_name: vaneloop-api
    ports:
      - "8000:8000"
    environment:
      - CASSANDRA_CONTACT_POINTS=cassandra
      - REDIS_URL=redis://redis:6379
      - CORS_ALLOW_ORIGINS=http://localhost:3000
    volumes:
      - ../data/raw:/app/data/raw:ro
      - ../benchmarks:/app/benchmarks:ro
    depends_on:
      cassandra:
        condition: service_healthy
      redis:
        condition: service_started

  replayer:
    build:
      context: ..
      dockerfile: replayer/Dockerfile
    container_name: vaneloop-replayer
    environment:
      - CASSANDRA_CONTACT_POINTS=cassandra
      - REDIS_URL=redis://redis:6379
      - REPLAY_MODE=loop       
      - REPLAY_TICK_MS=1000
    command: ["uv", "run", "python", "-m", "replayer.loop", "--dataset", "all"]  # <--- Replay ALL datasets
    volumes:
      - ../data/raw:/app/data/raw:ro
      - ../ml/artifacts:/app/ml/artifacts:ro
    depends_on:
      cassandra:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  cassandra_data:
  redis_data:
