[project]
name = "vaneloop"
version = "0.1.0"
description = "VaneLoop Aircraft Engine Health Monitoring System"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.6.0",
    "cassandra-driver>=3.29.0",
    "redis>=5.0.0",
    "pandas>=2.2.0",
    "typer>=0.9.0",
    "requests>=2.31.0",
    "scikit-learn>=1.4.0",
    "lightgbm>=4.3.0",
    "skl2onnx>=1.16.0",
    "onnxruntime>=1.17.0",
    "pyyaml>=6.0.1",
    "psutil>=7.2.2",
    "onnxmltools>=1.16.0",
]

[project.scripts]
vaneloop = "api.app.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api"]
